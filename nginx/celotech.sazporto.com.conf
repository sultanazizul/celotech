# celotech.sazporto.com: Celotechan Guide (static site)
#
# Put this file in /etc/nginx/sites-available/ (or merge it into the server block
# that already answers for celotech.sazporto.com) and copy celotech-headers.conf
# to /etc/nginx/snippets/.
#
# The site sits behind Cloudflare. KEEP the listen / ssl_certificate lines your
# current celotech.sazporto.com server block already has (Cloudflare origin
# certificate, port 443, redirects); only the parts below change.

# Files with ?v=<hash> never change, so they can be cached for a year.
# Files without it (favicon.ico, og.jpg requested by crawlers) get one day.
map $arg_v $celotech_cache {
    ""      "public, max-age=86400";
    default "public, max-age=31536000, immutable";
}

server {
    listen 80;
    listen [::]:80;
    # listen 443 ssl;            <- keep your existing TLS lines here
    # listen [::]:443 ssl;
    # ssl_certificate     ...;
    # ssl_certificate_key ...;
    server_name celotech.sazporto.com;

    root /var/www/celotech/current;
    index index.html;
    charset utf-8;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;

    # The page itself: always revalidate, so a new deploy shows up right away
    location = / {
        include snippets/celotech-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
    location = /index.html {
        include snippets/celotech-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Videos, images, scripts, icons (byte-range requests work out of the box, so videos can seek)
    location ~* \.(?:mp4|jpg|jpeg|png|webp|gif|svg|ico|woff2?|css|js)$ {
        include snippets/celotech-headers.conf;
        add_header Cache-Control $celotech_cache always;
        access_log off;
        try_files $uri =404;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        include snippets/celotech-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
    }

    # Never serve dotfiles (.DS_Store, .git ...)
    location ~ /\.(?!well-known/) {
        deny all;
    }

    location / {
        include snippets/celotech-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        include snippets/celotech-headers.conf;
        add_header Cache-Control "no-cache" always;
    }
}
